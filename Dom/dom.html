<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div  id="countainer" style="background-color:  red ;  width: 200px ; height: 200px; margin-bottom: 10px;"></div>
    <button id="btn1">change color</button>
    <button id="btn2">change color</button>

    <script>
        let bg = document.querySelector("#countainer")

        let button1 = document.querySelector("#btn1")

        button1.addEventListener("click", () => {
            bg.style.backgroundColor="blue"
        })

        let button2 = document.querySelector("#btn2")
        button2.addEventListener("click", () => {
            bg.style.hidden="hidden"
        })
        
    </script>
</body>
</html>
