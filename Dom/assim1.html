<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="prg1" style="font-size: 2em;"></p>
    <p id="prg2" style="font-size: 2em;"></p>
    <button id="btn1" style="width: 100px; height: 40px; background-color: blue; border-radius: 10px; color: white;">Isku Dar</button>
    <p id="result" style="font-size: 2em;"></p>
    <script>
        
        let prg1 = document.querySelector("#prg1")
        let prg2 = document.querySelector("#prg2")
        let btn1 = document.querySelector("#btn")
        let result = document.querySelector("#result")

        let num1 = parseInt(prompt("ENter num 1"))
        let num2 = parseInt(prompt("ENter num 2"))

        prg1.textContent=num1
        prg2.textContent=num2

        btn1.addEventListener("click",()=>{
            let sum = num1+num2
            result.textContent=sum
        })
        

    </script>
</body>
</html>
