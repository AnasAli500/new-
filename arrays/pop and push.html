<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        // pop remove the last element
        let names=["Abdi hakin","maha","kamal","deeqo"]
        names.pop()

        // push add the friast element
        names.push("Nasir")

        console.log(names)

        let name=["Abdi hakin","maha","kamal","deeqo"]
        // shift remove the first elenment 
        name.shift()
        // add the frist Element
        name.unshift("Toni")
        // xogta ayuu Nadaaminaaa 
        name.sort()
        // xogta ayuu gadinaa 
        name.reverse() 

        console.log(name)


        // splice Add and remove 
        let pos=["Abdi","salma","fatuma","html"]
        pos.splice(1,0, "ttt")
        console.log(pos)

    </script>
</body>
</html>
